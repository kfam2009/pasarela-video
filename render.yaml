services:
  - type: web
    name: pasarela-video
    runtime: docker
    plan: starter
    healthCheckPath: /salud
    disk:
      name: datos
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BRAND_NAME
        value: Pasarela Video
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: PRECIO_POR_ENTRADA
        value: "1000"
      - key: CF_ACCOUNT_ID
        value: 2dcb204b9febfad4a2bfb1a016916c6c
      - key: CF_API_TOKEN
        sync: false
      - key: CF_CUSTOMER_CODE
        value: il0jx6d1ltq7d0ad
      - key: VIDEO_HOST
        sync: false
      - key: BASE_URL
        sync: false
